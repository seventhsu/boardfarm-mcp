# Server settings
server:
  # Host and port
  host: 127.0.0.1
  port: 8080
  
  # MCP protocol
  mcp_version: "2024-11-05"
  
  # Limits
  max_concurrent_builds: 2
  max_build_time_seconds: 300
  default_board_timeout_minutes: 30
  
  # Logging
  log_level: INFO
  log_dir: ./logs
  
  # Security (MVP: local only)
  auth_required: false
  api_key: null  # set for production
  
# Build settings
build:
  # Default toolchain
  default_toolchain: zephyr
  
  # Zephyr SDK path
  zephyr_sdk: /opt/zephyr-sdk-0.16.5
  
  # Build cache
  cache_dir: ./cache/builds
  cache_size_mb: 1024
  
  # Container builds (optional)
  use_docker: false
  docker_image: zephyrprojectrtos/zephyr-build:latest

# Flash settings
flash:
  # OpenOCD config
  openocd_path: /usr/bin/openocd
  openocd_scripts: /usr/share/openocd/scripts
  
  # Flash verification
  verify_flash: true
  read_back_verify: true
  
  # Retry settings
  max_flash_attempts: 3
  flash_timeout_seconds: 60

# Test settings
test:
  default_timeout_seconds: 30
  frameworks:
    - pytest-embedded
    - robot
  
# Monitoring
monitor:
  # Serial log buffer size
  log_buffer_lines: 10000
  
  # Real-time streaming
  websocket_enabled: true
  websocket_port: 8081
