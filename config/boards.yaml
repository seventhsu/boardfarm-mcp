# Board Farm Configuration - Actual Connected Hardware

boards:
  # STM32 Nucleo H755ZI-Q - Connected via STLINK-V3
  nucleo-h755zi-q-01:
    type: stm32
    model: nucleo-h755zi-q
    mcu: STM32H755ZI
    description: "Dual-core development board (Cortex-M7/M4)"
    
    flash_size: 2048
    ram_size: 1024
    
    features:
      - ethernet
      - usb
      - dual_core
      - sd_card
      - can
      - spi
      - i2c
      - adc
      - dac
    capabilities:
      ram_kb: 1024
      flash_kb: 2048
      cpu_mhz: 480
      cores: 2
    
    debugger:
      type: stlink-v3
      transport: swd
      
    serial:
      port: /dev/ttyACM0
      baud: 115200
      
    supported_frameworks:
      - zephyr
      - mbed
      - baremetal
      
    zephyr:
      board_name: nucleo_h755zi_q
      soc: stm32h755xx
      sysbuild: true
      
    status: offline

  # CH57x (Magfest Swadge) - WCH BLE Dev Board
  ch57x-swadge-01:
    type: ch57x
    model: magfest-swadge
    mcu: CH570/CH572
    description: "WCH RISC-V BLE development board"
    
    flash_size: 448
    ram_size: 32
    
    features:
      - bluetooth
      - usb
      - spi
      - i2c
      - adc
    capabilities:
      ram_kb: 32
      flash_kb: 448
      cpu_mhz: 60
    
    debugger:
      type: wch-link
      transport: swd
      
    serial:
      port: /dev/ttyACM0  # Shared with H755 for now
      baud: 115200
      
    supported_frameworks:
      - ch32fun
      - baremetal
      
    status: offline

# Server settings
server:
  host: 127.0.0.1
  port: 8080
  max_concurrent_builds: 2
  max_build_time_seconds: 300
  default_board_timeout_minutes: 30
  log_level: INFO

# Build settings
build:
  default_toolchain: zephyr
  use_docker: true
  docker_image: zephyrprojectrtos/zephyr-build:latest

# Flash settings
flash:
  openocd_path: /usr/bin/openocd
  verify_flash: true
  max_flash_attempts: 3
  flash_timeout_seconds: 60
