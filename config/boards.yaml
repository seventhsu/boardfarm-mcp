# Board Farm Configuration
# Define all connected boards here

boards:
  # First STM32 Nucleo board
  nucleo-f401re-01:
    type: stm32
    model: nucleo-f401re
    mcu: STM32F401RET6
    description: "Primary development board"
    
    # Memory specs (KB)
    flash_size: 512
    ram_size: 96
    
    # Debug interface
    debugger:
      type: cmsis-dap  # or stlink, jlink
      transport: swd   # or jtag
      
    # Serial connection
    serial:
      port: /dev/ttyACM0
      baud: 115200
      
    # Build system support
    supported_frameworks:
      - zephyr
      - arduino
      - mbed
      - baremetal
      
    # Zephyr-specific
    zephyr:
      board_name: nucleo_f401re
      
    # Initial state
    status: offline  # will be detected on startup

  # Second STM32 Nucleo board
  nucleo-f401re-02:
    type: stm32
    model: nucleo-f401re
    mcu: STM32F401RET6
    description: "Testing/CI board"
    
    flash_size: 512
    ram_size: 96
    
    debugger:
      type: cmsis-dap
      transport: swd
      
    serial:
      port: /dev/ttyACM1  # different USB port
      baud: 115200
      
    supported_frameworks:
      - zephyr
      - arduino
      - baremetal
      
    zephyr:
      board_name: nucleo_f401re
      
    status: offline

